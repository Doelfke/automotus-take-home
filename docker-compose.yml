services:
  parkpatrol:
    build: .
    ports:
      - "3000:3000"
    volumes:
      # Mount source code for hot reload during development
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
      - ./vite.config.ts:/app/vite.config.ts
    environment:
      - NODE_ENV=development
